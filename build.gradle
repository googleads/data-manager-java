plugins {
    id 'com.diffplug.spotless' version '7.0.2' apply false
}

subprojects {
    apply plugin: 'com.diffplug.spotless'

    spotless {
        java {
            // Pin to 1.25.2 for Java 17 compatibility. Version 2.0.0+ requires
            // Java 21.
            googleJavaFormat('1.25.2')
        }
    }
}
